!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Massage Booking</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  padding:40px;
}

.card{
  background:white;
  max-width:500px;
  margin:auto;
  padding:30px;
  border-radius:10px;
}

input,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{
  background:#1D9E75;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>Book Massage Slot</h2>

<input type="text" id="emp-name" placeholder="Employee Name">

<select id="school">
  <option value="">Select School</option>
  <option>SAC</option>
  <option>DSG</option>
  <option>PREP</option>
</select>

<input type="date" id="booking-date">

<button onclick="confirmBooking()">
Confirm Booking
</button>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzlir2B1rdEmchJ56QQ1orNW4mJOdbRNRjWseZ2mfdErGB_oNC8Z5hf6YCrL5Q-cOBS2w/exec";

async function confirmBooking(){

  const payload = {
    formType: "massage",
    name: document.getElementById("emp-name").value,
    school: document.getElementById("school").value,
    date: document.getElementById("booking-date").value,
    slots: [
      {
        time: "10:00 - 10:15",
        slotNumber: 1
      }
    ]
  };

  try{

    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify(payload)
    });

    alert("Booking saved!");

  }catch(err){

    alert("Error saving booking");

  }
}
</script>

</body>
</html>
